name: Release and update Nexus
on:
  workflow_dispatch:
    inputs:
      publish_nexus:
        description: Update the existing Nexus Main File (inspect Nexus before retry)
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - name: Require game acceptance and build release
        run: python tools/package.py --release
      - name: Publish or verify the GitHub release
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_NEXUS: ${{ inputs.publish_nexus }}
          NEXUS_FILE_GROUP_ID: ${{ vars.NEXUS_FILE_GROUP_ID }}
          NEXUS_MOD_ID: ${{ vars.NEXUS_MOD_ID }}
          NEXUSMODS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
        run: python tools/release.py
      - name: Upload to Nexus Mods
        id: nexus
        if: steps.target.outputs.nexus_ready == 'true'
        uses: Nexus-Mods/upload-action@c96019556046053aa26044b44396cd38929daf23
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ vars.NEXUS_FILE_GROUP_ID }}
          filename: ${{ steps.target.outputs.asset }}
          version: ${{ steps.target.outputs.version }}
          display_name: ${{ steps.target.outputs.display_name }}
          description: ${{ steps.target.outputs.notes }}
          mod_id: ${{ vars.NEXUS_MOD_ID }}
          changelog: ${{ steps.target.outputs.notes }}
          category: main
          allow_mod_manager_download: ${{ vars.NEXUS_VORTEX_READY == 'true' }}
          primary_mod_manager_download: ${{ vars.NEXUS_VORTEX_READY == 'true' }}
          show_requirements_pop_up: true
          archive_existing_version: true
          update_mod_version: true
      - name: Verify Nexus acknowledgement and preserve file requirements
        if: steps.target.outputs.nexus_ready == 'true'
        env:
          NEXUS_VERSION_ID: ${{ steps.nexus.outputs.version_id }}
          NEXUS_FILE_GROUP_ID: ${{ vars.NEXUS_FILE_GROUP_ID }}
          NEXUS_MOD_ID: ${{ vars.NEXUS_MOD_ID }}
          NEXUSMODS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
        run: python tools/nexus_release.py
      - name: Save Nexus release receipt
        if: always() && inputs.publish_nexus
        uses: actions/upload-artifact@v6.0.0
        with:
          name: nexus-release-receipt
          path: dist/nexus-release.json
          if-no-files-found: warn
      - name: Announce the release in Discord
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ steps.target.outputs.version }}
          SEND_ANNOUNCEMENT: 'true'
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          DISCORD_CHANNEL_ID: '1534536549642014810'
          PRODUCT_NAME: Cabin Lobby Pets
          PRODUCT_SUMMARY: Show everyone's cats and dogs in the lobby and beside their Cabin chairs. Cabin pets are on by default; the host can turn them off. Requires UE4SS on the host and pet owners.
          PRODUCT_SUPPORT: https://support.doodesch.de/lobbypets
          NEXUS_MOD_URL: ${{ vars.NEXUS_MOD_URL }}
          PRODUCT_THUMBNAIL: https://raw.githubusercontent.com/DooDesch-Mods/TheCabinGame-LobbyPets/main/docs/thumbnail.png
        run: python tools/announce-release.py
      - name: Keep Discord acknowledgement
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: discord-announcement-${{ github.run_id }}
          path: discord-result.json
          if-no-files-found: warn
